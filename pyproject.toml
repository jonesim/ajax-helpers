[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ajax-advanced-helpers"
version = "1.0.6"
description = "Django app to assist with posting Ajax and receiving commands from django"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Ian Jones" },
]
maintainers = [
    { name = "Thomas Turner" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/django-advance-utils/ajax-advanced-helpers"
Upstream = "https://github.com/jonesim/ajax-helpers"

[tool.setuptools.packages.find]
include = ["ajax_helpers*"]

[tool.setuptools]
include-package-data = true
